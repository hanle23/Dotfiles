# ─── Terminal & shell ─────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -s extended-keys on                          # pass Shift+Enter etc. through to apps (Claude Code newline)
set -s extended-keys-format csi-u
set -as terminal-features ",*:extkeys"
set -g default-shell /usr/bin/fish    # use output of `command -v fish`

# ─── Prefix: Ctrl-a ───────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix                             # Ctrl-a Ctrl-a → sends Ctrl-a (fish: start of line)

# ─── Reload ───────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ─── Vim-style ────────────────────────────────────────────
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Tab last-window                              # replaces default prefix+l
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# Mouse drag only highlights; press y to copy (no copy-on-select)
bind -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection
bind -T copy-mode    MouseDragEnd1Pane send -X stop-selection

# ─── General ──────────────────────────────────────────────
set -g mouse on
set -g base-index 1                               # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on

# ─── Catppuccin (load BEFORE status config) ───────────────
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# ─── Status bar ───────────────────────────────────────────
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g  status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag  status-right "#{E:@catppuccin_status_session}"
set -ag  status-right "#{E:@catppuccin_status_uptime}"

# ─── Resurrect / Continuum ────────────────────────────────
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

# ─── Plugins (TPM) ────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'      # keep last: it hooks into status-right
set-hook -g client-detached 'run-shell -b "~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh quiet"'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
run ~/.config/tmux/plugins/tpm/tpm                # must be the final line
